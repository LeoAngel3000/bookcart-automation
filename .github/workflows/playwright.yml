# Playwright Test Automation CI/CD Pipeline
# 
# This workflow runs automated tests for the BookCart Test Automation Framework
# It includes multiple jobs for different test types and provides comprehensive reporting
#
# Author: Leonardo Ángel Cárrega
# Project: BookCart Test Automation (iDelsoft SDET Assignment 2025)

name: Playwright Tests

# Defines when the workflow will run
on:
  # Trigger on push to main branches
  push:
    branches: [ main, master, develop ]
  
  # Trigger on pull requests to main branches
  pull_request:
    branches: [ main, master ]
  
  # Allow manual workflow trigger from Actions tab
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Select test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - api
          - ui
          - integration
          - defects

# Environment variables used across all jobs
env:
  NODE_VERSION: '20'
  BASE_URL: 'https://bookcart.azurewebsites.net'

# Define jobs that run in parallel or sequentially
jobs:
  
  # ============================================
  # JOB 1: SMOKE TESTS (Fast Critical Path)
  # ============================================
  smoke-tests:
    name: 🔥 Smoke Tests (Critical Path)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: 🧪 Run Smoke Tests
        run: npx playwright test --grep @smoke
        env:
          CI: true
      
      - name: 📊 Upload Smoke Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 30
      
      - name: 📹 Upload Smoke Test Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-videos
          path: test-results/
          retention-days: 7

  # ============================================
  # JOB 2: API TESTS (Fast Backend Verification)
  # ============================================
  api-tests:
    name: 🔌 API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      # API tests don't need browsers - they're just HTTP requests
      # This makes them much faster
      - name: 🧪 Run API Tests
        run: npx playwright test --grep @api
        env:
          CI: true
      
      - name: 📊 Upload API Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # JOB 3: UI TESTS (Full Browser Testing)
  # ============================================
  ui-tests:
    name: 🖥️ UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      # Don't cancel all browsers if one fails
      fail-fast: false
      matrix:
        # Test on multiple browsers for cross-browser compatibility
        browser: [chromium, firefox, webkit]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: 🧪 Run UI Tests on ${{ matrix.browser }}
        run: npx playwright test --grep @ui --project=${{ matrix.browser }}
        env:
          CI: true
      
      - name: 📊 Upload UI Test Report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
      
      - name: 📹 Upload UI Test Videos (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-videos-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # ============================================
  # JOB 4: INTEGRATION TESTS
  # ============================================
  integration-tests:
    name: 🔗 Integration Tests (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Integration tests depend on API tests passing
    needs: [api-tests]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: 🧪 Run Integration Tests
        run: npx playwright test --grep @integration
        env:
          CI: true
      
      - name: 📊 Upload Integration Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # JOB 5: DEFECT DOCUMENTATION TESTS
  # ============================================
  defect-tests:
    name: 🐛 Defect Documentation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # These tests are expected to fail - they document known bugs
    continue-on-error: true
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      
      - name: 🧪 Run Defect Documentation Tests
        run: npx playwright test --grep @defect
        env:
          CI: true
      
      - name: 📊 Upload Defect Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defect-test-report
          path: playwright-report/
          retention-days: 30

  # ============================================
  # JOB 6: FULL REGRESSION SUITE
  # ============================================
  regression-tests:
    name: 🔄 Full Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run regression on main branch or manual trigger
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    # Wait for all other tests to pass before running full suite
    needs: [smoke-tests, api-tests, ui-tests, integration-tests]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🎭 Install All Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: 🧪 Run Full Regression Suite
        run: npx playwright test --grep @regression
        env:
          CI: true
      
      - name: 📊 Upload Regression Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-report
          path: playwright-report/
          retention-days: 30
      
      - name: 📹 Upload Regression Test Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-videos
          path: test-results/
          retention-days: 7

  # ============================================
  # JOB 7: TEST SUMMARY & REPORTING
  # ============================================
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    # Always run summary, even if some tests failed
    if: always()
    needs: [smoke-tests, api-tests, ui-tests, integration-tests, defect-tests]
    
    steps:
      - name: 📥 Download All Test Reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      
      - name: 📊 Generate Summary
        run: |
          echo "# 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔥 Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 API Tests | ${{ needs.api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ UI Tests | ${{ needs.ui-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐛 Defect Tests | ${{ needs.defect-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📁 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test reports are available in the Actions artifacts section." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔍 Known Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- TC-006: Books not displayed (Critical - API 500 error)" >> $GITHUB_STEP_SUMMARY
          echo "- TC-007: Price filter slider non-functional" >> $GITHUB_STEP_SUMMARY
          echo "- TC-005: No error message on invalid login" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These defects are documented and tracked in @defect tagged tests." >> $GITHUB_STEP_SUMMARY

# ============================================
# WORKFLOW BEST PRACTICES IMPLEMENTED:
# ============================================
# 
# ✅ Parallel execution for speed (independent jobs run together)
# ✅ Fail-fast disabled for browser matrix (test all browsers)
# ✅ Proper caching (npm dependencies cached between runs)
# ✅ Artifact retention (reports kept 30 days, videos 7 days)
# ✅ Job dependencies (integration waits for API tests)
# ✅ Conditional execution (regression only on main branch)
# ✅ Continue on error for defect tests (expected failures)
# ✅ Matrix strategy for cross-browser testing
# ✅ Timeout limits to prevent hanging jobs
# ✅ Manual workflow dispatch with options
# ✅ Comprehensive reporting with GitHub step summary
# ✅ Environment variable management
# ✅ Minimal browser installation for speed (only what's needed)
# 
# ESTIMATED EXECUTION TIME:
# - Smoke Tests: ~2-3 minutes
# - API Tests: ~1-2 minutes  
# - UI Tests: ~5-10 minutes per browser
# - Integration Tests: ~3-5 minutes
# - Defect Tests: ~2-3 minutes
# - Regression: ~20-30 minutes
#
# Total parallel execution: ~10-15 minutes
# Full sequential: ~40-60 minutes